<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="加厚鼠标垫">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="135" r="118" fill="url(#glow)"/>

  <circle cx="200" cy="135" r="86" fill="#ffffff" opacity="0.72"/>
  <circle cx="200" cy="135" r="86" fill="none" stroke="#7c3aed" stroke-opacity="0.28" stroke-width="1.5"/>

  <text x="200" y="167" font-size="88" text-anchor="middle" dominant-baseline="middle">🖱️</text>

  <text x="200" y="262" font-size="17" font-weight="600" fill="#7c3aed"
        text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        opacity="0.85">加厚鼠标垫</text>
</svg>
