<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="智能音箱">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="135" r="118" fill="url(#glow)"/>

  <circle cx="200" cy="135" r="86" fill="#ffffff" opacity="0.72"/>
  <circle cx="200" cy="135" r="86" fill="none" stroke="#ec4899" stroke-opacity="0.28" stroke-width="1.5"/>

  <text x="200" y="167" font-size="88" text-anchor="middle" dominant-baseline="middle">🔊</text>

  <text x="200" y="262" font-size="17" font-weight="600" fill="#ec4899"
        text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        opacity="0.85">智能音箱</text>
</svg>
